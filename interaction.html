```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Room</title>
    <link rel="stylesheet" href="interaction.css">
</head>
<body>

    <header>
        <a href="index.html" class="back-link">← Back to Home</a>
        <p class="eyebrow">YOUR LITTLE CORNER OF THE INTERNET</p>
        <h1>My Mood Room ♡</h1>
        <p class="intro">Pick a mood and watch your room transform.</p>
    </header>

    <main>
        <section class="room" id="room">
            <div class="room-decor" id="decor">✦ ♡ ✦</div>
            <div class="room-content">
                <p class="room-label">CURRENT VIBE</p>
                <h2 id="mood-title">Sweet & Dreamy</h2>
                <p id="mood-description">
                    A little pink, a little magic.
                </p>
                <div class="room-icon" id="room-icon">☁️</div>
            </div>
        </section>

        <section class="mood-picker">
            <h2>How are we feeling?</h2>
            <p>Choose your vibe below.</p>

            <div class="mood-options">
                <button class="mood-btn active" data-mood="dreamy">
                    ☁️ Dreamy
                </button>

                <button class="mood-btn" data-mood="happy">
                    ☀️ Happy
                </button>

                <button class="mood-btn" data-mood="chill">
                    🌿 Chill
                </button>

                <button class="mood-btn" data-mood="mysterious">
                    🌙 Mysterious
                </button>
            </div>
        </section>
    </main>

    <footer>
        Made with ♡ by me
    </footer>

    <script src="interaction.js"></script>
</body>
</html>
```
